name: Build Calendario Scuola APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Compila APK Release (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice della repository
        uses: actions/checkout@v4

      - name: Configura Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configura Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Genera progetto Android, nome app e icona Tocco di Laurea
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp lib/main.dart /tmp/main.dart.bak

          if [ ! -f "android/gradlew" ]; then
            flutter create . \
              --project-name school_vibe_argo \
              --org it.schoolvibe \
              --platforms=android
          fi

          cp /tmp/pubspec.yaml.bak pubspec.yaml
          mkdir -p lib
          cp /tmp/main.dart.bak lib/main.dart
          rm -f test/widget_test.dart

          python3 -m pip install --quiet pillow
          python3 - << 'PYEOF'
          import os
          from PIL import Image, ImageDraw

          BLUE = (61, 133, 198, 255)
          WHITE = (255, 255, 255, 255)
          TRANSPARENT = (0, 0, 0, 0)

          CAP_AND_TASSEL = [
              (500, 190), (900, 365), (500, 540), (272, 440),
              (225, 474), (225, 626), (285, 715), (285, 822),
              (192.5, 748), (100, 822), (100, 715), (160, 626),
              (160, 436), (200, 409), (100, 365),
          ]
          HEADBAND = [
              (285, 505), (500, 599), (715, 505),
              (715, 598), (500, 692), (285, 598),
          ]

          def render_cap(out_px, bg, scale):
              hi = 2048
              if os.path.exists("icon.png"):
                  src = Image.open("icon.png").convert("RGBA")
                  canvas = Image.new("RGBA", (hi, hi), bg)
                  box = int(hi * scale)
                  resized = src.resize((box, box), Image.Resampling.LANCZOS)
                  off = (hi - box) // 2
                  canvas.paste(resized, (off, off), resized)
                  return canvas.resize((out_px, out_px), Image.Resampling.LANCZOS)

              img = Image.new("RGBA", (hi, hi), bg)
              draw = ImageDraw.Draw(img)
              def tr(pts):
                  return [
                      (
                          hi * (0.5 + ((x - 500.0) / 1000.0) * scale),
                          hi * (0.5 + ((y - 505.0) / 1000.0) * scale),
                      )
                      for (x, y) in pts
                  ]
              draw.polygon(tr(CAP_AND_TASSEL), fill=BLUE)
              draw.polygon(tr(HEADBAND), fill=BLUE)
              return img.resize((out_px, out_px), Image.Resampling.LANCZOS)

          res_root = "android/app/src/main/res"
          densities = {
              "mipmap-mdpi": (48, 108),
              "mipmap-hdpi": (72, 162),
              "mipmap-xhdpi": (96, 216),
              "mipmap-xxhdpi": (144, 324),
              "mipmap-xxxhdpi": (192, 432),
          }

          for folder, (legacy_px, fg_px) in densities.items():
              dpath = os.path.join(res_root, folder)
              os.makedirs(dpath, exist_ok=True)
              legacy_img = render_cap(legacy_px, WHITE, 0.90)
              legacy_img.save(os.path.join(dpath, "ic_launcher.png"))
              legacy_img.save(os.path.join(dpath, "ic_launcher_round.png"))
              fg_img = render_cap(fg_px, TRANSPARENT, 0.56)
              fg_img.save(os.path.join(dpath, "ic_launcher_foreground.png"))

          val_dir = os.path.join(res_root, "values")
          os.makedirs(val_dir, exist_ok=True)
          with open(os.path.join(val_dir, "ic_launcher_background.xml"), "w") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>\n')

          anydpi_dir = os.path.join(res_root, "mipmap-anydpi-v26")
          os.makedirs(anydpi_dir, exist_ok=True)
          adaptive_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          '''
          with open(os.path.join(anydpi_dir, "ic_launcher.xml"), "w") as f:
              f.write(adaptive_xml)
          with open(os.path.join(anydpi_dir, "ic_launcher_round.xml"), "w") as f:
              f.write(adaptive_xml)
          PYEOF

          cat > android/app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "it.schoolvibe.school_vibe_argo"
              compileSdk = 35
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  coreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_1_8
              }

              defaultConfig {
                  applicationId = "it.schoolvibe.school_vibe_argo"
                  minSdk = 21
                  targetSdk = 35
                  multiDexEnabled = true
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                      minifyEnabled = false
                      shrinkResources = false
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>

              <application
                  android:label="Calendario Scuola"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.action.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          EOF

      - name: Installa dipendenze Flutter
        run: flutter pub get

      - name: Compila APK in modalità Release
        run: flutter build apk --release

      - name: Prepara file APK con nome leggibile
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/calendario-scuola.apk

      - name: Carica APK negli Artifacts di GitHub
        uses: actions/upload-artifact@v4
        with:
          name: calendario-scuola-apk
          path: build/app/outputs/flutter-apk/calendario-scuola.apk
          if-no-files-found: error
          retention-days: 30
